[server]
runOnSave = true
# L'app n'écoute que sur ce poste. Par défaut Streamlit écoute sur toutes
# les interfaces (0.0.0.0) : n'importe qui sur le réseau du labo pouvait
# ouvrir l'app et parcourir les projets. Pour l'ouvrir volontairement au
# réseau local : ethoflow --server.address=0.0.0.0
address = "localhost"

[logger]
# Masque les messages internes (« Uvicorn server started… ») ; les
# erreurs et avertissements restent affichés.
level = "warning"


[browser]
gatherUsageStats = false

[client]
# Pas de bouton « Deploy » : il chevauchait la colonne Activité.
toolbarMode = "minimal"

# Refonte 1c (design_handoff_ethoflow_ui) : papier, encre, accent indigo,
# IBM Plex. Le rail sombre et les cartes sont stylés en CSS (style.css).
[theme]
base = "light"
primaryColor = "#4f46c8"
backgroundColor = "#f6f5f1"
secondaryBackgroundColor = "#efede7"
textColor = "#1c1b19"
borderColor = "#e0ddd5"
linkColor = "#4f46c8"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
baseRadius = "6px"
# Corps de texte à 14 px comme la maquette : alertes, cases, champs et
# boutons Streamlit s'alignent sur le texte des pages.
baseFontSize = 14
showWidgetBorder = true
showSidebarBorder = false

[theme.sidebar]
backgroundColor = "#1c1b19"
secondaryBackgroundColor = "#34322e"
textColor = "#d8d5cc"
