# Environnement DeepLabCut 3.x (PyTorch backend).
#
# Installable sur :
#   - Mac (Apple Silicon ou Intel) : tourne en CPU ou MPS, pour tests / inférence légère
#   - Linux/Windows + GPU NVIDIA      : tourne en CUDA, pour entraînement et prod
#
# Le drapeau `--pre` est nécessaire car DLC 3.x est encore tagué pre-release
# sur PyPI ; sans lui, pip retombe sur DLC 2.3.x (TensorFlow), qui ne supporte
# pas Apple Silicon (build de PyTables 3.8.0 en échec).
#
# Création :
#   conda env create -f environment-dlc.yml
#   conda activate dlc
#
# Vérification :
#   python -c "import deeplabcut; print(deeplabcut.__version__)"
#   python -c "import torch; print('CUDA:', torch.cuda.is_available()); print('MPS:', torch.backends.mps.is_available())"

name: dlc
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - ipython
  - ffmpeg
  - pyside6                       # framework GUI (remplace wxPython sur Mac)
  - pip:
      - torch
      - torchvision
      - --pre
      - deeplabcut[gui,modelzoo]

# ⚠️ APRÈS création de l'env, sur Windows ou Linux avec GPU NVIDIA :
# vérifier que torch a bien la build CUDA. Si `torch.__version__` finit
# par '+cpu' (cas fréquent sur Windows) OU si tu as un GPU Blackwell
# (RTX 50xx, sm_120) qu'aucune build stable ne supporte encore, faire :
#
#     conda activate dlc
#     pip uninstall torch torchvision torchaudio -y
#     pip install --pre torch torchvision torchaudio \
#         --index-url https://download.pytorch.org/whl/nightly/cu128
#
# Test final (doit afficher le nom de ta GPU) :
#     python -c "import torch; x = torch.randn(1024,1024,device='cuda'); print(torch.cuda.get_device_name(0))"
