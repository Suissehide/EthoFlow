# Environnement DeepLabCut 3.x (PyTorch backend).
#
# Installable sur :
#   - Mac (Apple Silicon ou Intel) : tourne en CPU ou MPS, pour tests / inférence légère
#   - Linux/Windows + GPU NVIDIA   : tourne en CUDA, pour entraînement et prod
#
# Création :
#   conda env create -f environment-dlc.yml
#   conda activate dlc
#
# Vérification (doit afficher CUDA: True sur une machine avec GPU NVIDIA) :
#   python -c "import torch; print('CUDA:', torch.cuda.is_available())"
#
# Si ça renvoie False :
#   python scripts/diagnose_gpu.py --fix
#
# Le drapeau `--pre` est nécessaire car DLC 3.x est encore tagué pre-release
# sur PyPI ; sans lui, pip retombe sur DLC 2.3.x (TensorFlow), qui ne supporte
# pas Apple Silicon (build de PyTables 3.8.0 en échec).

name: dlc
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - ipython
  - ffmpeg
  - pyside6                       # framework GUI (remplace wxPython sur Mac)
  - pip:
      # Index CUDA en PLUS de PyPI. Sans lui, `pip install torch` récupère
      # la build CPU sur Windows (PyPI ne publie que celle-là) et
      # torch.cuda.is_available() renvoie False.
      #
      # Pourquoi ça marche : les wheels CUDA sont versionnées `2.5.1+cu124`
      # et, en PEP 440, `2.5.1+cu124` est supérieure à `2.5.1`. À version
      # de base égale, pip préfère donc la CUDA.
      #
      # Pourquoi ce n'est pas garanti : si PyPI publie une version plus
      # récente que l'index CUDA (2.6.0 vs 2.5.1), pip prend la plus haute,
      # donc la CPU. Et une RTX 50xx (Blackwell, sm_120) a besoin de cu128,
      # qui n'existe qu'en nightly — hors de portée d'un fichier conda.
      # D'où la vérification post-install, et `diagnose_gpu.py --fix` qui
      # tranche les deux cas.
      #
      # Sur Mac : cet index n'a aucune wheel macOS, pip retombe sur PyPI.
      # Aucun effet, aucune erreur.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch
      - torchvision
      - --pre
      - deeplabcut[gui,modelzoo]

# ---------------------------------------------------------------------
# Après création, sur Windows/Linux avec GPU NVIDIA :
#
#     conda activate dlc
#     python -c "import torch; print('CUDA:', torch.cuda.is_available())"
#
# CUDA: True  → rien à faire.
# CUDA: False → python scripts/diagnose_gpu.py --fix
#
# Le script identifie la cause (build CPU, build CUDA trop ancienne pour
# la carte, driver absent) et réinstalle depuis l'index adapté.
#
# Équivalent manuel pour une RTX 50xx :
#     pip uninstall torch torchvision torchaudio -y
#     pip install --pre torch torchvision torchaudio \
#         --index-url https://download.pytorch.org/whl/nightly/cu128
#
# Test final (doit afficher le nom de ta GPU) :
#     python -c "import torch; x = torch.randn(1024,1024,device='cuda'); print(torch.cuda.get_device_name(0))"
